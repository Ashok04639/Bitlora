<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#05070b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f4ff"/>
      <stop offset="25%" stop-color="#62c8ff"/>
      <stop offset="55%" stop-color="#1685e8"/>
      <stop offset="100%" stop-color="#06477f"/>
    </linearGradient>

    <linearGradient id="textBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bcecff"/>
      <stop offset="35%" stop-color="#55bdff"/>
      <stop offset="70%" stop-color="#238ee2"/>
      <stop offset="100%" stop-color="#79cfff"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5"
                    flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- SMALL PREMIUM ICON -->
  <g filter="url(#shadow)">
    <rect x="8" y="8"
          width="84" height="84"
          rx="24"
          fill="url(#iconBg)"
          stroke="#17466d"
          stroke-width="2"/>

    <rect x="14" y="14"
          width="72" height="72"
          rx="19"
          fill="none"
          stroke="#287db6"
          stroke-width="1"/>

    <!-- BITLORA SYMBOL -->
    <path d="
      M34 25
      L54 25
      C67 25 74 31 74 40
      C74 46 71 50 65 53
      C72 56 76 61 76 68
      C76 78 68 83 55 83
      L34 83
      Z"
      fill="url(#blue)"
      stroke="#8edcff"
      stroke-width="1.2"
      stroke-linejoin="round"/>

    <path d="
      M43 34
      L54 34
      C60 34 64 36 64 40
      C64 44 60 47 54 47
      L43 47
      Z"
      fill="#03070d"/>

    <path d="
      M43 56
      L55 56
      C62 56 66 59 66 64
      C66 69 62 73 55 73
      L43 73
      Z"
      fill="#03070d"/>

    <rect x="39" y="31"
          width="5"
          height="45"
          rx="2.5"
          fill="#071a2c"/>
  </g>

  <!-- BITLORA WORDMARK -->
  <text x="112"
        y="62"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="900"
        letter-spacing="3"
        fill="url(#textBlue)">
    BITLORA
  </text>

  <!-- PREMIUM UNDERLINE -->
  <rect x="114" y="72"
        width="220"
        height="2"
        rx="1"
        fill="#176da7"/>

</svg>
